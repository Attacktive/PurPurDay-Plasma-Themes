# YAML forbids tabs in indentation, hence spaces throughout this file.
name: 'CI'

on:
  push:
    tags: ['**']
  pull_request:

concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  validate:
    name: 'Validate theme assets'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7'

      - name: 'Install xmllint'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: 'Validate SVG files are well-formed XML'
        run: find . -name '*.svg' -print0 | xargs -0 xmllint --noout

      - name: 'Validate metadata.json files'
        run: find . -name 'metadata.json' -print0 | xargs -0 -n 1 jq empty

      - name: 'Validate INI-style files (colors, metadata.desktop, plasmarc)'
        run: python3 .github/scripts/validate-ini.py

  release:
    name: 'Publish a GitHub release'
    if: startsWith(github.ref, 'refs/tags/')
    needs: 'validate'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
    steps:
      - uses: 'actions/checkout@v7'

      - name: 'Derive the version from the tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=Vulgar-Display-of-Purple-$version.tar.gz" >> "$GITHUB_ENV"

      - name: 'Ensure the theme metadata versions match the tag'
        working-directory: 'PurPurDay Plasma Themes/Vulgar-Display-of-Purple'
        run: |
          json_version="$(jq --raw-output '.KPlugin.Version' metadata.json)"
          if [ "$json_version" != "$VERSION" ]; then
            echo "::error::metadata.json declares version $json_version but the tag demands $VERSION."
            exit 1
          fi

          if ! grep --quiet --fixed-strings --line-regexp "X-KDE-PluginInfo-Version=$VERSION" metadata.desktop; then
            echo "::error::metadata.desktop is missing X-KDE-PluginInfo-Version=$VERSION."
            exit 1
          fi

      - name: 'Pack the KDE Store archive'
        run: tar --create --gzip --file "$ARCHIVE" --directory 'PurPurDay Plasma Themes' 'Vulgar-Display-of-Purple'

      - name: 'Create the release'
        uses: 'softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b' # v3.0.1
        with:
          files: '${{ env.ARCHIVE }}'
          generate_release_notes: true
          fail_on_unmatched_files: true
